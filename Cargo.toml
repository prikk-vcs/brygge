[workspace]
resolver = "3"
members  = ["crates/*", "tools/*"]

[workspace.package]
version      = "0.3.0"
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0"
authors      = ["nabbisen"]
repository   = "https://github.com/prikk-vcs/brygge"
homepage     = "https://github.com/prikk-vcs/brygge"

[workspace.dependencies]
brygge-ir = { version = "0.3.0", path = "crates/brygge-ir" }
brygge-decode-git = { version = "0.3.0", path = "crates/brygge-decode-git" }
brygge-decode-hg = { version = "0.3.0", path = "crates/brygge-decode-hg" }
brygge-decode-svn = { version = "0.3.0", path = "crates/brygge-decode-svn" }
brygge-decode-cvs = { version = "0.3.0", path = "crates/brygge-decode-cvs" }
# The only third-party dependency of the light core (RFC 003 D-3): SHA-256, matching prikk's audited
# `sha2` usage. brygge-ir links no serialization crate (the codec is hand-rolled) and no decoder library
# (RFC 009 D-1 — those are isolated in future brygge-decode-* crates).
sha2 = "0.10"
# The Git decoder's heavy dependency (RFC 004 D-1, owner-approved 2026-09-04 under RFC 009 D-6). Pure
# Rust, MIT/Apache, MSRV 1.85 (no bump to the core). gix's **default features carry no network
# transport** — the `*-network-client` / `*-http-transport-*` features are opt-in and left off — so
# brygge links no `gix-transport`/TLS/HTTP stack and performs no network I/O (INV-3, RFC 009 D-4);
# `blob-diff` (tree→PathOps) and `revision` (ancestry walk) are the only additions on top of defaults.
# Isolated in `brygge-decode-git`; no other crate links it (RFC 009 D-1).
# See handoffs/004-git-decoder/gix-security-review-v1.md.
gix = { version = "0.87", features = ["blob-diff", "revision"] }
# The Mercurial decoder's revlog decompression (RFC 005 D-1, Tier 2 pure-Rust reader). Both are pure Rust
# (no C): flate2 with the `rust_backend` (miniz_oxide) for zlib chunks, ruzstd for zstd chunks (the modern
# hg default). Small, decompression-only; isolated in `brygge-decode-hg` (RFC 009 D-1). No gix-scale review.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.7"
# The Mercurial decoder's revision-hash verification: SHA-1 with collision detection, as Mercurial itself
# uses (sha1dc). Already in the lock file through gix-hash, so this adds only a dependency edge for
# `brygge-decode-hg`, not a new crate (architect decision under RFC 009, release-prep handoff §1).
# Default features (`oid`, `std`) are off: `oid` would add the `const-oid` crate to the lock file.
sha1-checked = { version = "0.10.0", default-features = false }
# The Subversion decoder's dump-checksum verification (RFC 013 D-2, OQ-5 ruled 2026-09-25): `svnrdump` writes
# MD5 only (no SHA-1), so verifying every node's checksum, and so our own delta application, needs MD5.
# RustCrypto, the family of `sha1` and `digest` (0.10, already in the lock file). A consistency check only, not
# authenticity: the dump is untrusted and states whatever checksum it likes. No default features (`std` off).
md-5 = { version = "0.10", default-features = false }

# MSRV note (0.1.0 release preparation, part 2): `Cargo.lock` holds the transitive `human_format` (through
# `gix-features` -> `prodash`) at 1.1.0. Release 1.2.1 uses let-chains, does not declare a `rust-version`,
# and so does not build on the declared MSRV (1.85); 1.1.0 is the newest release that does, and `prodash`
# accepts it (`>=1.0.3`). Lock-only: no new crate. Do not `cargo update` it past 1.1.0 without re-running
# the 1.85 gates.

# Lint discipline mirrors the ecosystem: unsafe is forbidden everywhere except a future dedicated FFI
# crate (RFC 009 D-3); public items are documented; the panic-prone clippy lints warn so review holds
# the line — brygge parses untrusted source repositories and must never panic on malformed input.
[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used      = "warn"
expect_used      = "warn"
indexing_slicing = "warn"

[profile.release]
# CR-16: `brygge`'s decoder panic boundary (`guard_decoder`, crates/brygge/src/commands.rs) relies on
# unwinding to convert an unexpected panic inside a decoder or a decoder dependency (e.g. gix) into a
# typed, documented exit (FAILURE) rather than an unclassified process abort. Do not set
# `panic = "abort"` here or on any other profile without first revisiting that boundary.
#
# Architect decision (review 011 §9): overflow checks stay ON in release. A wrap that reaches a claim
# (found in the CVS date parser, review 008 F-1) would otherwise be silent; with checks on, any wrap that
# review misses becomes a panic, which `guard_decoder` turns into a typed failure (exit 1), never a false
# value. The cost is negligible next to I/O and hashing.
overflow-checks = true
