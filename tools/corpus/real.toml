# RFC 014 D-4 (batch R): the approved real-world corpus (review 066, amending request 042's R-1 list).
#
# Hand-parsed by `tools/bench/src/real.rs` (no new dependency: a small subset of TOML — `[[entry]]`
# tables of `key = "value"` strings only, one entry per line, no nesting). Do not add types this parser
# does not already handle without updating it.
#
# Git and hg: `pin` is the commit/node id alone — fetching and checking it out *is part of* the
# integrity check, but not all of it (review 128 G-1): the decoder also carries every `refs/heads/*` and
# `refs/tags/*` it finds, and `pin` alone says nothing about those. So every git entry also carries
# `refs`, the SHA-256 of `git for-each-ref --format='%(objectname) %(refname)'` **after** the fetch
# normalizes the clone to exactly the pin (its branch reset to the pin, every remote removed, every tag
# not merged into the pin deleted) — the same normalization `real-fetch` performs and `real-check`
# re-verifies, so a tag added later to an old commit, or a moved branch, is refused loudly instead of
# silently decoding more than the pin. hg entries need no equivalent field: `real-fetch` clones with
# `hg clone -r <pin>` (pulling only the pin's ancestors) and deletes any bookmarks, and `.hgtags` is part
# of the pinned history itself, so the pin alone already fixes what the decoder carries.
#
# SVN and CVS have no single id, so `hash` is required: the SHA-256 of the dump file (SVN, in its
# **canonical** form — review 128 S-3: each revision's node records stable-sorted by `Node-path`, since
# `svnrdump`'s own node order within a revision is not stable across runs even for identical content) or
# of the sorted-path-and-content tree (CVS, `sha256sum` over each file's own hash, sorted by relative
# path, hashed together). The runner refuses a cache mismatch rather than silently using stale data.
#
# Nothing here is committed into this repository. `cache_dir` (the runner's own argument) is the project's
# own git-ignored `fixtures/corpus` (review 111 N-1, superseding RFC 014 D-4's "always outside this
# repository"): fetched or dumped once by `tools/fixtures.sh fetch`, verified by `tools/fixtures.sh
# verify`, so no task rebuilds its own cache in `/tmp` or elsewhere outside the project.

