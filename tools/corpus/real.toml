# RFC 014 D-4 (batch R): the approved real-world corpus (review 066, amending request 042's R-1 list).
#
# Hand-parsed by `tools/bench/src/real.rs` (no new dependency: a small subset of TOML — `[[entry]]`
# tables of `key = "value"` strings only, one entry per line, no nesting). Do not add types this parser
# does not already handle without updating it.
#
# Git and hg: `pin` is the commit/node id alone — fetching and checking it out *is* the integrity
# check. SVN and CVS have no single id, so `hash` is required: the SHA-256 of the dump file (SVN) or of
# the sorted-path-and-content tree (CVS, `sha256sum` over each file's own hash, sorted by relative
# path, hashed together). The runner refuses a cache mismatch rather than silently using stale data.
#
# Nothing here is fetched automatically into this repository — `cache_dir` (the runner's own argument)
# is always outside it, and nothing under it is committed.

