name: Docs

# RFC 012 D-11: the documentation is published as a book, built with mdBook from docs/src/, at
# https://prikk-vcs.github.io/brygge/ on every change to `main` under docs/. GitHub Pages is set to deploy from
# GitHub Actions. No release credential is involved: the deploy job may write Pages and mint the Pages OIDC
# token, and nothing else. ci.yml builds the same book on every branch push and pull request, so a broken page
# is caught before this workflow deploys anything.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      # A change of the pinned mdBook, or of the build gate, redeploys.
      - "tools/install-mdbook.sh"
      - "tools/build-book.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the book
    runs-on: ubuntu-latest
    # `pages: read` lets configure-pages read the Pages settings; nothing here can write them.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      # The one pinned mdBook, shared with ci.yml (tools/install-mdbook.sh).
      - name: Install mdBook
        run: ./tools/install-mdbook.sh
      - name: Set up Pages
        uses: actions/configure-pages@v6
      # Fails on any warning, so a broken page never reaches the site.
      - name: Build the book
        run: ./tools/build-book.sh
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
