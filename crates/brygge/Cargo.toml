[package]
name        = "brygge"
description = "brygge: carry version-control history out of Git/Mercurial/SVN/CVS into an intermediate representation, and encode a target from it. The command-line launcher."
readme      = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[dependencies]
brygge-ir = { workspace = true }
# The CLI wires decoders in (RFC 009 D-1 permits this for the binary); the IR core and
# `verify --internal` still link no decoder.
brygge-decode-git = { workspace = true }
brygge-decode-hg = { workspace = true }

[lints]
workspace = true
