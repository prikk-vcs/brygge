[package]
name        = "brygge"
description = "Carry version-control history out of Git, Mercurial, Subversion and CVS into an intermediate representation (IR), with every inference marked and every loss recorded: decode, inspect and verify."
readme      = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[dependencies]
brygge-ir = { workspace = true }
# The CLI wires decoders in (RFC 009 D-1 permits this for the binary); the IR core and
# `verify --internal` still link no decoder.
brygge-decode-git = { workspace = true }
brygge-decode-hg = { workspace = true }
brygge-decode-svn = { workspace = true }
brygge-decode-cvs = { workspace = true }

[dev-dependencies]
# Path-only, test-only (RFC 014 D-1): dropped by `cargo publish`. No `version` (review 059 F-1): see
# brygge-ir's Cargo.toml for why.
brygge-mutate = { path = "../../tools/mutate" }
# Test-only, for the resigned-mutation approach (recomputing an artifact's digest after mutating its
# body — brygge-ir's own algorithm, duplicated here since `brygge-ir::canon` is crate-private). Already
# linked transitively via `brygge-ir`; this is a dev-dependency only, dropped on publish.
sha2 = { workspace = true }
# Test-only (review 099 R-2): parsing a contract-0.3.0 artifact exactly as `ir-artifact-format.md`
# describes it, to resign a mutated one — `brygge-ir::artifact`'s own frame codec is crate-private, so
# this is an independent reimplementation against the published page (a check that the page suffices,
# PU-3), not a reuse of brygge-ir's internals. Already linked transitively via `brygge-ir`; no new
# crate, and dropped on publish.
miniz_oxide = { workspace = true }

[lints]
workspace = true
