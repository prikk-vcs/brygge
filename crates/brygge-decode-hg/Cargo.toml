[package]
name        = "brygge-decode-hg"
description = "brygge's Mercurial source decoder: reads a local hg repository's revlog store directly (pure Rust, no hg binary) and produces a brygge-ir IR, mostly Stated including source-recorded renames. The one crate that reads hg (RFC 009 D-1)."
readme      = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[dependencies]
brygge-ir = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
sha1-checked = { workspace = true }

[dev-dependencies]
# Path-only, test-only (RFC 014 D-1): dropped by `cargo publish`. No `version` (review 059 F-1): see
# brygge-ir's Cargo.toml for why.
brygge-mutate = { path = "../../tools/mutate" }

[lints]
workspace = true
