# cargo-deny policy (RFC 009 D-5/D-6). Run in CI: `cargo deny check`.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# brygge is Apache-2.0; dependencies must be permissively licensed. A copyleft C library (e.g. libgit2)
# is deliberately excluded here (RFC 009 D-5) and would need explicit owner sign-off to add.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # MPL-2.0 is a **file-level weak copyleft on a pure-Rust crate** — it obliges sharing changes to that
    # crate's own files only, and imposes nothing on brygge's code. It reaches the tree solely via
    # `uluru` (gix-pack's LRU object cache), an unavoidable part of the gix object-database path adopted
    # under RFC 004 D-1. This is categorically distinct from the copyleft *C library* RFC 009 D-5 flags
    # for owner sign-off; recorded here as a license-policy note. (gix-security-review-v1.md §Licenses.)
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path-only dependency with no `version` is a "wildcard" by this check's own definition, but a
# dev-dependency on a `publish = false`, path-only tool crate (e.g. `brygge-mutate`, RFC 014 D-1) is
# exactly that on purpose: giving it a `version` instead would be kept in the published manifest, and
# crates.io requires that version to exist there, which it never will (review 059 F-1 — a real `cargo
# publish` would fail at the first crate; `--dry-run` resolves workspace members locally and would not
# have caught it). The release-tools guard (`tools/check-release-dev-deps.sh`) independently checks that
# no such versioned dev-dependency on a `publish = false` crate ever reaches a published manifest.
allow-wildcard-paths = true
# The light core (brygge-ir) must never link a source-decoder or C-git library (RFC 009 D-1/D-2).
# Prefer pure-Rust `gix` for Git; ban the libgit2 bindings workspace-wide. A future decoder that truly
# needs a C library adds a scoped, owner-approved exception in its own RFC.
deny = [
    { name = "git2" },
    { name = "libgit2-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
